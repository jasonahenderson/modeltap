<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>modeltap - Metrics</title>
    <style>
        /* Minimal base styles - will be replaced by WU-026 index.html */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #f0f2f5;
            color: #212529;
            line-height: 1.5;
        }
        .dashboard-header {
            background: #1a1a2e;
            color: #fff;
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .dashboard-header h1 {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }
        .dashboard-header h1 span { color: #4a90d9; }
        .dashboard-nav {
            display: flex;
            gap: 0.25rem;
        }
        .dashboard-nav a {
            color: #adb5bd;
            text-decoration: none;
            padding: 0.4rem 1rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            transition: all 0.15s;
        }
        .dashboard-nav a:hover { color: #fff; background: rgba(255,255,255,0.08); }
        .dashboard-nav a.active { color: #fff; background: #4a90d9; }
        .dashboard-main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    </style>
    <link rel="stylesheet" href="metrics.css">
</head>
<body>
    <header class="dashboard-header">
        <h1>model<span>tap</span></h1>
        <nav class="dashboard-nav">
            <a href="index.html">Logs</a>
            <a href="metrics.html" class="active">Metrics</a>
            <a href="index.html#status">Status</a>
        </nav>
    </header>
    <main class="dashboard-main">
        <div id="metrics-view"></div>
    </main>
    <script src="metrics.js"></script>
</body>
</html>
