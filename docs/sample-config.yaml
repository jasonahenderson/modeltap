# modeltap — sample config
#
# Location (PATCH-0006):
#   ~/.modeltap/config.yaml                     (default)
#   $XDG_CONFIG_HOME/modeltap/config.yaml       (when XDG_CONFIG_HOME is set)
#   ~/.config/modeltap/config.yaml              (legacy, still honored with a
#                                                deprecation warning for one
#                                                release cycle)
#
# All other modeltap state (SQLite DB, runtime server socket, service log) also
# lives under ~/.modeltap/ by default, or $XDG_DATA_HOME/modeltap/ when
# that env var is set.
#
# Minimum required for `modeltap harness`: one provider with an api_key,
# and a routing.default that points at a model that provider serves.
# Everything else has sane defaults.
#
# Environment variables can override any value — prefix MODELTAP_ and
# uppercase the key (e.g. MODELTAP_RUNTIME_SOCKET_PATH).
#
# dotenv (PATCH-0007): modeltap auto-loads ./.env then ~/.modeltap/.env
# at startup. Variables already in the process environment win; the
# file fills in the gaps. Handy for provider keys:
#
#   echo 'ANTHROPIC_API_KEY=sk-ant-...' >> ~/.modeltap/.env
#   chmod 600 ~/.modeltap/.env
#
# Disable with MODELTAP_DOTENV=false; trace with MODELTAP_DEBUG_DOTENV=1.

# ---------------------------------------------------------------------
# v0.1 proxy config (modeltap start) — optional, unchanged from v0.1.
# The harness auto-starts `modeltap start` when the runtime server socket is
# absent, so if you only run the harness you can ignore this section.
# ---------------------------------------------------------------------

port: 8080
upstream: https://api.anthropic.com
db_path: ~/.modeltap/modeltap.db
retention_days: 30
max_body_size: 10MB

dashboard:
  enabled: false
  port: 3001
  bind: 127.0.0.1

# ---------------------------------------------------------------------
# Providers — used by BOTH the proxy (when Upstream is set) AND the runtime server
# (when Type is set). For the harness, you want Type + APIKey.
# ---------------------------------------------------------------------

providers:
  # Anthropic (Claude). The harness will dial this when routing
  # resolves to a Claude model.
  #
  # About host routing (PATCH-0005): when the v0.1 proxy is running
  # alongside the harness (the default via auto-start), runtime server provider
  # traffic is routed through http://127.0.0.1:<port> so your
  # conversations land in the proxy's capture tables (modeltap logs,
  # modeltap dashboard). To skip the proxy and dial the provider
  # directly, uncomment `host:` below.
  anthropic:
    type: anthropic                    # runtime server endpoint type
    # api_key supports three forms (PATCH-0004):
    #   env:VAR         — read from environment (recommended)
    #   file:/abs/path  — read from a file (Docker secrets, CI)
    #   sk-...          — plain (NOT recommended: config is committable)
    api_key: env:ANTHROPIC_API_KEY
    # host: https://api.anthropic.com  # uncomment to skip the proxy

  # OpenAI (GPT-4/5 etc.). Uncomment + fill in to route to OpenAI.
  # openai:
  #   type: openai
  #   api_key: env:OPENAI_API_KEY
  #   # host: https://api.openai.com   # uncomment to skip the proxy

  # Local Ollama. Discover lets the runtime server auto-enumerate installed
  # models via /api/tags on startup. Always routed direct (local
  # already — proxy interposition would be a no-op).
  # ollama-local:
  #   type: ollama
  #   host: http://localhost:11434
  #   discover: true

# ---------------------------------------------------------------------
# runtime server (terminal harness backend) config.
# ---------------------------------------------------------------------

runtime:
  # Unix-domain socket the harness dials. Default: ~/.modeltap/server.sock
  # (or $XDG_DATA_HOME/modeltap/server.sock when XDG_DATA_HOME is set).
  socket_path: ~/.modeltap/server.sock
  # socket_mode: 0o600  # default already; tighten if your home is shared.

  # Team / enterprise profile. Leaving these unset keeps the runtime server
  # socket-only. TLS REFUSES to bind without tls_client_ca_file
  # (mTLS required — see WU-094 security review).
  # tls_address: 0.0.0.0:9443
  # tls_cert_file: /path/to/server.crt
  # tls_key_file: /path/to/server.key
  # tls_client_ca_file: /path/to/client-ca.crt

  # Attachment cap: server rejects turn.submit whose Attachments sum
  # above this size. Default 5 MiB.
  # max_attachment_size: 5242880

  # Manual model-catalog overrides. Built-in + Ollama-discovery catalog
  # already knows the common names; only needed for custom deployments.
  # models:
  #   my-custom-model:
  #     provider: ollama-local
  #     context_window: 32768
  #     capabilities: [text, tools]
  #     description: In-house fine-tune

  # Routing tree. The harness resolves `default` on every turn.submit.
  # Values are either a single model name (single-model turn) or an
  # array of names (multi-model; deferred to FEAT-0013 sub-agents).
  routing:
    default: claude-sonnet-4-6
    # Per-use-case overrides, selected via the role hint in a turn.
    # coding: claude-opus-4-7
    # cheap: claude-haiku-4-5
    # review: [claude-opus-4-7, gpt-5]   # multi-model, FEAT-0013

# ---------------------------------------------------------------------
# Pricing overrides (proxy cost tracking). Built-in pricing is baked
# in; uncomment to override a specific model.
# ---------------------------------------------------------------------

# pricing:
#   overrides:
#     - model: claude-sonnet-4-6
#       input_per_million: 3.00
#       output_per_million: 15.00
